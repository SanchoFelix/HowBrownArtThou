<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Well Do You Know My World?</title>
    <!-- Google Fonts for Elegant Cultural Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b091a;
            --card-glass: rgba(255, 255, 255, 0.96);
            --gold-primary: #d4af37;
            --gold-hover: #b89228;
            --text-dark: #1e1b2e;
            --text-muted: #64748b;
            --correct: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.95);
            --wrong: #f43f5e;
            --wrong-bg: rgba(244, 63, 94, 0.95);
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            transition: background-color 0.8s ease;
            overflow-x: hidden;
        }

        .quiz-container {
            background: var(--card-glass);
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(212, 175, 55, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Sophisticated Feedback Animations */
        @keyframes pulseGold {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 35px rgba(212, 175, 55, 0.5); }
            100% { transform: scale(1); }
        }

        @keyframes shakeRuby {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .quiz-container.correct-pulse { animation: pulseGold 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .quiz-container.wrong-shake { animation: shakeRuby 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #2a1b4e;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #786c96;
            font-size: 0.92rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin: 18px 0 22px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f43f5e);
            transition: width 0.4s ease;
        }

        /* Image Display Box */
        .image-card {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.15);
            background: #1e1b2e;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .image-card:hover img {
            transform: scale(1.03);
        }

        /* Animated Feedback Overlays */
        .feedback-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            transform: translateY(-100%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        .feedback-overlay .status-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .feedback-overlay.show-correct {
            opacity: 1;
            transform: translateY(0);
            background: var(--correct-bg);
        }

        .feedback-overlay.show-wrong {
            opacity: 1;
            transform: translateY(0);
            background: var(--wrong-bg);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 18px;
            line-height: 1.45;
            min-height: 52px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-dark);
            font-weight: 500;
            line-height: 1.35;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--gold-primary);
            background: #fffdf5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            color: white !important;
            border-color: var(--correct) !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            color: white !important;
            border-color: var(--wrong) !important;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-hover));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.98rem;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Result Screen */
        #result-screen {
            text-align: center;
            display: none;
            padding: 20px 0;
        }

        #result-screen h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #2a1b4e;
            margin-bottom: 10px;
        }

        #result-screen .score {
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--gold-primary);
            margin: 15px 0;
            text-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
        }

        #result-screen .feedback {
            font-size: 1.15rem;
            color: #475569;
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-card">
    <header>
        <h1>How Well Do You Know My World?</h1>
        <p class="subtitle">An Interactive Cultural Journey</p>
    </header>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-screen">
        <div class="image-card">
            <img id="question-image" src="" alt="Cultural Question Image">
            <div id="feedback-overlay" class="feedback-overlay">
                <span class="status-title" id="status-title"></span>
            </div>
        </div>

        <div class="question-card">
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div class="controls">
            <span class="progress-text" id="progress-text">Question 1 of 15</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <div id="result-screen">
        <h2>Journey Complete!</h2>
        <div class="score" id="final-score">0 / 15</div>
        <div class="feedback" id="feedback-text"></div>
        <button class="btn" onclick="restartQuiz()">Play Again</button>
    </div>
</div>

<script>
    // Rich background palette transitions per question
    const bgColors = [
        "#0f172a", "#1e1b4b", "#064e3b", "#7c2d12", "#4c1d95",
        "#134e4a", "#312e81", "#1e3a8a", "#0f766e", "#831843",
        "#701a75", "#365314", "#18181b", "#0284c7", "#15803d"
    ];

    const questions = [
        {
            q: "1. You walk into an Indian household. What is the absolute FIRST thing you must do?",
            img: "https://images.unsplash.com/photo-1595052299224-b52ddb9e25b6?w=800&auto=format&fit=crop&q=80",
            options: ["Hand over a formal gift basket", "Take off your shoes immediately at the door", "Ask for the WiFi password", "Compliment the curtains"],
            answer: 1
        },
        {
            q: "2. If an Indian mother offers you food and you say, 'No thank you, I’m full,' what actually happens next?",
            img: "https://images.unsplash.com/photo-1613292443284-8d10ef9383fe?w=800&auto=format&fit=crop&q=80",
            options: ["She respects your boundaries and clears the table", "She offers a light glass of water instead", "She serves a massive second plate anyway because 'you look skinny'", "She takes it personally and asks if you hate her cooking"],
            answer: 2
        },
        {
            q: "3. What is the universal, multi-purpose Indian gesture known as the 'Head Bobble' used for?",
            img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop&q=80",
            options: ["Yes", "Maybe / I understand", "Sure, why not?", "All of the above, depending on speed, angle, and context"],
            answer: 3
        },
        {
            q: "4. What is the designated official function of a blue Royal Dansk Butter Cookie tin in an Indian home?",
            img: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=800&auto=format&fit=crop&q=80",
            options: ["Holding actual butter cookies", "Storing sewing supplies, threads, and random buttons", "Hiding emergency cash stash", "A decorative living room paperweight"],
            answer: 1
        },
        {
            q: "5. In Indian culture, what does '5 minutes away' actually mean when meeting up?",
            img: "https://images.unsplash.com/photo-1508962914676-134849a727f0?w=800&auto=format&fit=crop&q=80",
            options: ["Exactly 300 seconds", "I am putting on my shoes and leaving in 20 minutes", "I am currently stuck in traffic two towns over", "Both B and C"],
            answer: 3
        },
        {
            q: "6. What happens if you accidentally touch or bump your foot against a book, paper, or person?",
            img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&auto=format&fit=crop&q=80",
            options: ["Say 'Excuse me' and keep walking", "Ignore it; feet happen", "Touch the item/person with your hand, then your chest/forehead out of respect", "Apologize profusely in three languages"],
            answer: 2
        },
        {
            q: "7. What is Chai, and how should it NEVER be ordered?",
            img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=800&auto=format&fit=crop&q=80",
            options: ["It's spiced tea, and never call it 'Chai Tea' (which literally means 'Tea Tea')", "It's iced coffee with cinnamon", "It's a smoothie bowl topping", "It's only consumed after midnight"],
            answer: 0
        },
        {
            q: "8. What is the primary role of 'Aunties' in the community ecosystem?",
            img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=800&auto=format&fit=crop&q=80",
            options: ["Organizing local neighborhood watch programs", "Running a high-efficiency intelligence and matchmaking network", "Teaching professional yoga classes", "Distributing baked goods on weekends"],
            answer: 1
        },
        {
            q: "9. How many times must you be offered refreshments at a host's home before it is polite to accept?",
            img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&auto=format&fit=crop&q=80",
            options: ["Immediately on the first try", "Refuse at least twice before reluctantly accepting on the third offer", "Wait 45 minutes silently", "You must bring your own snacks"],
            answer: 1
        },
        {
            q: "10. What is the primary function of the spice box (Masala Dabba) in the kitchen?",
            img: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=800&auto=format&fit=crop&q=80",
            options: ["A decorative counter ornament", "Contains 7 essential spices that drive every meal's flavor profile", "A secret box for storing candy", "A container for loose change"],
            answer: 1
        },
        {
            q: "11. Why do older family members hand you cash tucked into an envelope before you leave?",
            img: "https://images.unsplash.com/photo-1553729459-efe14ef6055d?w=800&auto=format&fit=crop&q=80",
            options: ["It's a mistake; give it right back", "Blessing/Love (Aashirwad) — accept it after a brief polite token refusal", "Payment for visiting them", "To pay for your ride home"],
            answer: 1
        },
        {
            q: "12. What is Bollywood, really?",
            img: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&auto=format&fit=crop&q=80",
            options: ["Just regular movies made in Hollywood", "An explosion of drama, romance, epic dance numbers, and 3-hour cinematic sagas", "A sports league", "A type of street food"],
            answer: 1
        },
        {
            q: "13. What is 'Nimbu Mirchi' (lemon and green chilies on a thread) used for?",
            img: "https://images.unsplash.com/photo-1588347818036-558601350947?w=800&auto=format&fit=crop&q=80",
            options: ["Making instant hot sauce", "Warding off the 'evil eye' (Nazar) from homes and vehicles", "A festive tree ornament", "A natural kitchen air freshener"],
            answer: 1
        },
        {
            q: "14. How are leftovers typically stored in an Indian refrigerator?",
            img: "https://images.unsplash.com/photo-1584269600464-37b1b58a9fe7?w=800&auto=format&fit=crop&q=80",
            options: ["In clear, labeled glass containers", "In reused yogurt, ice cream, or takeout containers", "Wrapped neatly in aluminum foil", "Left uncovered on the top shelf"],
            answer: 1
        },
        {
            q: "15. What is the official state of mind on Sunday afternoons after a heavy meal of Biryani or Rajma Chawal?",
            img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=800&auto=format&fit=crop&q=80",
            options: ["Ready to go for a 5-mile run", "Deep, unbreakable 'Food Coma' nap time", "Time to clean the entire house", "Answering work emails"],
            answer: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        document.getElementById('next-btn').disabled = true;
        
        // Reset feedback overlay
        const overlay = document.getElementById('feedback-overlay');
        overlay.className = 'feedback-overlay';
        document.getElementById('status-title').innerText = '';

        // Transition background theme
        document.body.style.backgroundColor = bgColors[currentQuestionIndex % bgColors.length];

        const currentQ = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQ.q;
        document.getElementById('question-image').src = currentQ.img;
        document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;

        // Progress bar update
        const progressPercent = (currentQuestionIndex / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        currentQ.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => handleAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedIndex, selectedBtn) {
        if (answered) return;
        answered = true;

        const currentQ = questions[currentQuestionIndex];
        const card = document.getElementById('quiz-card');
        const overlay = document.getElementById('feedback-overlay');
        const statusTitle = document.getElementById('status-title');
        const allBtns = document.querySelectorAll('.option-btn');

        allBtns.forEach(b => b.disabled = true);

        if (selectedIndex === currentQ.answer) {
            score++;
            selectedBtn.classList.add('correct');
            card.classList.add('correct-pulse');
            
            statusTitle.innerText = "✦ PERFECT! ✦";
            overlay.classList.add('show-correct');

            setTimeout(() => card.classList.remove('correct-pulse'), 500);
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[currentQ.answer].classList.add('correct');
            card.classList.add('wrong-shake');

            statusTitle.innerText = "✕ NOT QUITE!";
            overlay.classList.add('show-wrong');

            setTimeout(() => card.classList.remove('wrong-shake'), 500);
        }

        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('progress-bar').style.width = '100%';
        document.body.style.backgroundColor = "#0b091a";

        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.display = 'block';

        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        
        const feedback = document.getElementById('feedback-text');
        if (score >= 13) {
            feedback.innerText = "🏆 Certified Desi Royalty! You know the unwritten rules, respect the chai, and could negotiate with the toughest Aunties.";
        } else if (score >= 8) {
            feedback.innerText = "👍 Impressive! You'll effortlessly navigate family dinners, though watch out for surprise second helpings of food!";
        } else {
            feedback.innerText = "🌶️ Cultural Bootcamp Needed! Time for an intensive crash course in fresh chai, head bobbles, and shoe etiquette.";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
